[project]
name = "im_svg_maker"
version = "0.1.0"
description = "Infinity-mirror fabrication file generator: black SVG -> laser SVG/DXF + 3D plug 3MF/STL"
requires-python = ">=3.11"
dependencies = [
    "svgelements>=1.9",
    "shapely>=2.0",
    "trimesh>=4.0",
    "manifold3d>=2.5",
    "ezdxf>=1.3",
    "pydantic>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "potracer>=0.0.4",
]

[project.scripts]
im_svg_maker = "im_svg_maker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["im_svg_maker*"]
