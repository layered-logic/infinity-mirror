<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layered Logic — Canonical Rest Pose (Light Mode)
  Same geometry as logo-primary-dark.svg (see that file for parameter derivation).
  Colors: dark-mode electric-indigo anchors held as-is on a white ground (decision 2026-04-21).
    outerCol = #4A25FF   innerCol = #3214FF   background = #FFFFFF
  Note: the mark still reads electric on white but without the magenta loudness of
  the earlier violet pair. For paper/print/one-color contexts, use logo-primary-mono.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-40 -360 300 400"
     width="300" height="400"
     role="img"
     aria-label="Layered Logic logo — two nested L shapes tilted 4 degrees off vertical">
  <title>Layered Logic</title>
  <rect x="-40" y="-360" width="300" height="400" fill="#FFFFFF"/>

  <!-- Outer L -->
  <g stroke="#4A25FF" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="22.32" y1="-319.22" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="220" y2="0"/>
  </g>

  <!-- Inner L -->
  <g stroke="#3214FF" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="40.05" y1="-305.91" x2="19.95" y2="-18.60"/>
    <line x1="19.95" y1="-18.60" x2="199.95" y2="-18.60"/>
  </g>
</svg>
