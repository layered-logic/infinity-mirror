<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layered Logic — Canonical Rest Pose (Dark Mode)
  Derived from P5 source at https://github.com/layered-logic/layered-logic-logo
  Parameters (as of 2026-04-21):
    angleDeg = 86      lenVert = 320       lenHorz = 220
    innerLen = 180     gap = 20            inner vLen = 288 (lenVert * 0.9)
    wOuter = 7         wInner = 6          background = #0A0A0A
    outerCol = #4A25FF (brand primary — electric indigo)
    innerCol = #3214FF (brand secondary — paired indigo, matches P5 inner)
  Rest pose = no mouse interaction = two static L polylines (d > histRadius branch).
  See assets/brand/logo/logo-code-notes.md for full parameter explanation.
  Palette shift 2026-04-21: magenta-leaning violet (#BF00FF/#A020D0) replaced by
  electric indigo to align with the P5 sketch's existing direction — more
  engineering-coded, cooler, free of magenta cast.
  P5 source already renders #420AFF/#3214FF; a minor bump on the outer from #420AFF
  to #4A25FF is pending sync when the logo track reopens.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-40 -360 300 400"
     width="300" height="400"
     role="img"
     aria-label="Layered Logic logo — two nested L shapes tilted 4 degrees off vertical">
  <title>Layered Logic</title>
  <rect x="-40" y="-360" width="300" height="400" fill="#0A0A0A"/>

  <!-- Outer L: V0 (top of vertical) → V1 (corner at origin) → V2 (end of horizontal) -->
  <g stroke="#4A25FF" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="22.32" y1="-319.22" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="220" y2="0"/>
  </g>

  <!-- Inner L: corner inset 20px perpendicular to each arm -->
  <g stroke="#3214FF" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="40.05" y1="-305.91" x2="19.95" y2="-18.60"/>
    <line x1="19.95" y1="-18.60" x2="199.95" y2="-18.60"/>
  </g>
</svg>
