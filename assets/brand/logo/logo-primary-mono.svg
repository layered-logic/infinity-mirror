<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layered Logic — Canonical Rest Pose (Monochrome)
  Same geometry as logo-primary-dark.svg (see that file for parameter derivation).
  Single-color variant for contexts where the violet anchors are wrong:
    - Laser etch into product (one physical color, defined by the process)
    - Single-color print / photocopy / fax-safe
    - Embossing, foil stamp, vinyl cut
    - Over photography or busy backgrounds
  Strokes are #000000 on a transparent ground. To use on dark ground, swap the
  stroke color to #FFFFFF (or any single color appropriate to the medium).
  Stroke widths (7 / 6) are preserved to maintain the outer/inner hierarchy
  even when color no longer distinguishes them.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-40 -360 300 400"
     width="300" height="400"
     role="img"
     aria-label="Layered Logic logo — two nested L shapes tilted 4 degrees off vertical">
  <title>Layered Logic</title>

  <!-- Outer L -->
  <g stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="22.32" y1="-319.22" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="220" y2="0"/>
  </g>

  <!-- Inner L -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="40.05" y1="-305.91" x2="19.95" y2="-18.60"/>
    <line x1="19.95" y1="-18.60" x2="199.95" y2="-18.60"/>
  </g>
</svg>
